<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richiesta inviata | Studio Iuorio Odontoiatri</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#0e2a47;--navy-2:#163b61;--teal:#1497a8;--teal-dk:#0d7685;--aqua:#e7f6f8;--gold:#f2b134;--ink:#1d2733;--muted:#5b6b7b;--bg:#fff;--soft:#f5f8fb;--line:#dfe7ef;--wa:#25d366;--r:14px;--shadow:0 10px 30px rgba(14,42,71,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.75;font-size:18px}
h1,h2,h3,h4{font-family:"Montserrat",sans-serif;color:var(--navy);line-height:1.25}
a{color:var(--teal-dk)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:14px 24px;border-radius:50px;font:700 .9rem "Montserrat",sans-serif;text-decoration:none;text-transform:uppercase;letter-spacing:.04em;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-teal{background:var(--teal);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.top{background:var(--navy);color:#cfe0ee;font-size:.85rem}
.top .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top a{color:#fff;text-decoration:none;font-weight:600}
header.nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:800 1.2rem "Montserrat",sans-serif;color:var(--navy);text-decoration:none;line-height:1.1}
.logo small{display:block;font:600 .68rem "Open Sans",sans-serif;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
header nav a{margin-left:22px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem}
header nav a.btn{color:var(--navy);padding:11px 20px}
@media(max-width:860px){header nav a:not(.btn){display:none}}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--teal-dk) 130%);color:#fff;padding:56px 0 60px}
.btn-home{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);padding:10px 18px;font-size:.8rem;margin-bottom:22px}
.btn-home:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hero .eyebrow{display:block;font:700 .78rem "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7fd3de;margin-bottom:.8em}
.hero h1{color:#fff;font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:800;max-width:820px}
.hero p{color:#d9e7f3;max-width:760px;margin-top:.8em;font-size:1.1rem}
.byline{margin-top:1.4em;font-size:.88rem;color:#b9cfe2}
.crumbs{font-size:.82rem;color:var(--muted);padding-top:14px;padding-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.crumbs li+li::before{content:"›";margin-right:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;padding:20px 20px 72px}
@media(max-width:940px){.layout{grid-template-columns:1fr}}
article h2{font-size:1.55rem;margin:1.8em 0 .5em}
article h2:first-child{margin-top:0}
article p{margin-bottom:1em}
article ul,article ol{margin:0 0 1.2em 1.3em}
article li{margin-bottom:.45em}
.answer{background:var(--aqua);border-left:5px solid var(--teal);border-radius:var(--r);padding:22px 26px;margin-bottom:1.4em}
.answer p:last-child{margin:0}
.ph{aspect-ratio:16/9;border-radius:var(--r);background:repeating-linear-gradient(45deg,#eef3f8,#eef3f8 10px,#e4ecf4 10px,#e4ecf4 20px);display:flex;align-items:flex-end;justify-content:center;padding:10px;font:700 .75rem "Montserrat",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 1.6em}
.tbl-wrap{overflow-x:auto;margin:0 0 1.4em;border-radius:var(--r);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:520px;background:#fff}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
thead th{background:var(--navy);color:#fff;font-family:"Montserrat",sans-serif}
tbody th{color:var(--navy)}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 18px}
.faq summary{cursor:pointer;list-style:none;padding:16px 28px 16px 0;font:700 1rem "Montserrat",sans-serif;color:var(--navy);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:12px;font-size:1.4rem;color:var(--teal)}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--muted);padding-bottom:16px;margin:0}
.cta-box{background:var(--navy);color:#fff;border-radius:20px;padding:32px;margin-top:2.2em}
.cta-box h2{color:#fff;margin-top:0}
.cta-box p{color:#d4e3f0}
.cta-box .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.note{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:2em;border-top:1px solid var(--line);padding-top:14px}
aside .box{position:sticky;top:92px;display:grid;gap:16px}
.side{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.side h3{font-size:1rem;margin-bottom:.6em}
.side ul{list-style:none}
.side li{margin-bottom:.7em;font-size:.95rem;line-height:1.4}
.side li a{text-decoration:none;font-weight:600}
.side.cta{background:var(--navy);border:0;color:#d4e3f0}
.side.cta h3{color:#fff}
.side.cta p{font-size:.92rem;margin-bottom:1em}
.side.cta .btn{width:100%;justify-content:center;margin-bottom:8px}
footer{background:#081b2e;color:#9fb3c6;font-size:.88rem;padding:36px 0}
footer a{color:#cfe0ee}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
footer h4{color:#fff;font-size:.95rem;margin-bottom:.6em}
footer ul{list-style:none}
.legal{border-top:1px solid #1d3550;margin-top:22px;padding-top:16px;font-size:.78rem;grid-column:1/-1}
.mobile-cta{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:10px 12px;gap:10px}
.mobile-cta .btn{flex:1;justify-content:center;padding:13px 10px;font-size:.82rem}
@media(max-width:700px){.mobile-cta{display:flex}body{padding-bottom:72px}}

.thanks{max-width:680px;margin:0 auto;padding:80px 20px;text-align:center}
.thanks h1{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:.5em}
.thanks p{color:var(--muted);margin-bottom:1.4em}
.thanks .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="/">Iuorio Odontoiatri<small>Estetica dentale · Parodontologia</small></a>
</div></header>
<main class="thanks">
  <h1>Grazie, abbiamo ricevuto la tua richiesta</h1>

  <div class="row">
    <a class="btn btn-primary" href="/">← Torna alla home</a>
    <a class="btn btn-wa" href="https://api.whatsapp.com/send?phone=393387776558&text=Buongiorno%2C%20vorrei%20informazioni%20sul%20composite%20bonding" rel="noopener">WhatsApp</a>
  </div>
</main>
</body>
</html>
