[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://injectiontecniqueaversa.netlify.app/*"
  to = "https://injection.specialistiparodontite.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
